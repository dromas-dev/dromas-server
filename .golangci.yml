# The lint AGENTS.md names, run as `golangci-lint run ./...` here and in CI.
# dromas-server keeps the same file: change both together.
version: "2"

linters:
  enable:
    - forbidigo
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    forbidigo:
      # Replaces forbidigo's own default list, which forbids fmt.Print.
      forbid:
        # A protocol token is ASCII, and Unicode's case mappings read
        # characters that are no token's as ASCII letters (U+017F as s, the
        # Kelvin sign as k), lowering and raising alike.
        - pattern: ^(strings|bytes)\.(EqualFold|ToLower|ToUpper|ToTitle)$
          msg: compare a protocol token in any case with protocol.LowerASCII (dromas-client#405)
      analyze-types: true
  exclusions:
    # Test files are linted with the rest, but their findings are not reported:
    # the gate is clean outside _test.go.
    paths:
      - _test\.go$

issues:
  # Every finding, never 3 of a kind: a new one must not hide behind old ones.
  max-issues-per-linter: 0
  max-same-issues: 0
