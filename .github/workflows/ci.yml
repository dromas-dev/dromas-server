# The gate AGENTS.md lists before every push, run on every push to main,
# every pull request and every merge group (the merge queue's test of a pull
# request on main and those queued ahead of it, GitHub's merge_group event),
# so each commit's result is on the public record, and
# once a day, when govulncheck meets advisories published since. release.yml
# runs it all again on a release's tag before it builds (workflow_call).
# Actions are pinned by commit, each with its release beside it. go.mod requires a
# release of dromas-client; dromas-client's own CI runs `check.sh full` here
# against its commit, through a go.work.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A pull request's newer push cancels its older run; every other run is its own.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    # Two OpenSSH releases for test/interop.sh's script: 9.6p1 and 10.2p1.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
      - name: postgres
        # The test database, test/postgres/compose.yaml: a job's services take
        # no server options, so it is started here, from the file Dependabot
        # keeps pinned.
        run: |
          docker compose -f test/postgres/compose.yaml up -d
          # Over TCP: the image's first start runs its initialisation on a
          # server that listens on the Unix socket alone, then restarts.
          for _ in $(seq 60); do docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d dromas_test && break; sleep 1; done
          docker exec postgres pg_isready -h 127.0.0.1 -U postgres -d dromas_test
      - name: tools
        run: |
          go version; ssh -V; jq --version; curl --version | head -1; bash --version | head -1; nginx -v
          go list -m github.com/dromas-dev/dromas-client
          docker exec postgres postgres --version
      - name: check
        # gofmt, vet, every test in memory and again on PostgreSQL (a skip
        # fails the job, but the shared-store tests' in memory), and
        # test/interop.sh on PostgreSQL, two shards behind the image's nginx:
        # scripts/check.sh, which a laptop runs too.
        env:
          DROMAS_TEST_POSTGRES: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: dromas
          PGDATABASE: dromas_test
          PGSSLMODE: disable
        run: scripts/check.sh full

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          # No Go cache here: setup-go saves one only when its key misses, and
          # this job shares the key of the test job on this image, so its smaller
          # build would be saved first and the test job's never (#427).
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          # No Go cache here: setup-go saves one only when its key misses, and
          # this job shares the key of the test job on this image, so its smaller
          # build would be saved first and the test job's never (#427).
          cache: false
      - run: scripts/check.sh vuln
