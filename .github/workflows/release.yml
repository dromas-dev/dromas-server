# dromasd's releases (AGENTS.md § Releases), on a pushed tag v*:
# - tag: the tag must be signed by a key in .github/allowed_signers, checked
#   with git verify-tag as Caddy checks its own;
# - ci: the whole of ci.yml runs on the tagged commit;
# - release: GoReleaser builds it (.goreleaser.yaml): the image, from the
#   binaries it built, pushed under its version (GoReleaser pushes images
#   before it publishes the release), then the archives, an SBOM of each and
#   checksums.txt, signed with cosign, as the tag's GitHub release; every
#   file the checksums name is attested, and the image is attested with an
#   SPDX SBOM of it, each attestation pushed to the registry;
# - verify: the published release and image are checked as the release's
#   notes have a user check them, as GoReleaser checks its own;
# - rebuild: the release is built again from its tag on another image, and
#   each archive must come out as the release job made it, which verify has
#   checked against what was published.
# By hand (workflow_dispatch), all of it but the tag and verify, on main as a
# snapshot published nowhere: so a release's every build and test runs
# before any tag is made. Actions are
# pinned by commit, each with its release beside it, and GoReleaser by its
# version.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.ref_name }}
  REPO: ${{ github.repository }}

jobs:
  tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: the tag's signature
        # Checkout can leave the tag a lightweight ref to its commit
        # (actions/checkout#290), so it is fetched again as pushed. A tag that
        # is lightweight, unsigned, or signed by a key the file does not name
        # for git fails here.
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git -c gpg.ssh.allowedSignersFile=.github/allowed_signers verify-tag "$TAG"

  ci:
    needs: tag
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [tag, ci]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    outputs:
      go: ${{ steps.go.outputs.go-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag as pushed
        # For its message, which heads the release's notes (.goreleaser.yaml).
        if: github.ref_type == 'tag'
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version: stable
          check-latest: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: ${{ github.ref_type == 'tag' && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-checksums: ./dist/checksums.txt
      - name: the image's digest, from GoReleaser's dist/digests.txt
        # One line a tag, "<hex>  <image>:<tag>", every tag the one
        # multi-platform image. actions/attest pushes an attestation to the
        # registry for one subject alone, named without a tag.
        if: github.ref_type == 'tag'
        id: image
        run: |
          cat dist/digests.txt
          [ "$(cut -d' ' -f1 dist/digests.txt | sort -u | wc -l)" -eq 1 ]
          digest=$(awk -v image="ghcr.io/$OWNER/dromasd:${TAG#v}" '$2 == image { print $1 }' dist/digests.txt)
          [ -n "$digest" ]
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/dromasd
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      # The image's SBOM, by syft as GoReleaser's of the archives, attested
      # with actions/attest's sbom-path as GitHub documents it.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: github.ref_type == 'tag'
        with:
          image: ghcr.io/${{ github.repository_owner }}/dromasd@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dromasd-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/dromasd
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: dromasd-image.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checksums
          path: dist/checksums.txt

  verify:
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: the release, as a user downloads it
        run: |
          gh --version
          gh release download "$TAG" -R "$REPO" -D release
          ls -l release
      - name: checksums.txt, signed by this workflow at this tag
        working-directory: release
        run: |
          cosign verify-blob \
            --certificate-identity "https://github.com/$REPO/.github/workflows/release.yml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle checksums.txt.sigstore.json checksums.txt
          sha256sum --strict -c checksums.txt
      - name: each file's attestation, built by this workflow from this tag
        working-directory: release
        # gh prints nothing on a pass off a terminal, so each file passed is
        # named after it, and the log shows which were checked (#503 item 2);
        # a failure ends the step (bash -e) before its name is printed.
        run: |
          while read -r _ file; do
            gh attestation verify "$file" -R "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" --deny-self-hosted-runners
            echo "attested: $file"
          done < checksums.txt
      - name: the release's own attestation, which GitHub makes of an immutable release
        working-directory: release
        run: |
          gh release verify "$TAG" -R "$REPO"
          for file in *; do gh release verify-asset "$TAG" "$file" -R "$REPO"; done
      - name: the image, built and attested by this workflow from this tag
        run: |
          gh attestation verify "oci://ghcr.io/$REPO_OWNER/dromasd:${TAG#v}" -R "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" --deny-self-hosted-runners
          gh attestation verify "oci://ghcr.io/$REPO_OWNER/dromasd:${TAG#v}" -R "$REPO" \
            --signer-workflow "$REPO/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" --deny-self-hosted-runners \
            --predicate-type https://spdx.dev/Document/v2.3
        env:
          REPO_OWNER: ${{ github.repository_owner }}

  rebuild:
    needs: release
    # A skipped job upstream (tag, on a hand-run) skips every job after it
    # unless the job says otherwise.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: github.ref_type == 'tag'
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.release.outputs.go }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: ${{ github.ref_type == 'tag' && 'release --clean --skip=publish,sign,sbom' || 'release --snapshot --clean --skip=sign,sbom,docker' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
          path: published
      - name: each archive, as the release job made it
        # The SBOMs are left out: syft writes a new document name and time
        # each run.
        run: |
          grep -E '\.(tar\.gz|zip)$' published/checksums.txt | sort > published.sums
          grep -E '\.(tar\.gz|zip)$' dist/checksums.txt | sort > rebuilt.sums
          cat rebuilt.sums
          diff published.sums rebuilt.sums
