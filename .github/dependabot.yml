# Dependency updates as pull requests (dromas-client's AGENTS.md: dependencies
# are minimums, moved to the latest by committed updates). CI runs on each one
# before it is merged, so every build, and every tag, matches a commit.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    # Indirect modules too, as go get -u ./... moves them, among them each
    # tool go.mod's tool lines name (govulncheck), whose module is indirect.
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The test database CI starts (test/postgres/compose.yaml), pinned the same
  # way. Its PostgreSQL stays at the oldest major version this backend runs
  # on (minServerVersion), so a new major version does not come as a pull
  # request.
  - package-ecosystem: docker-compose
    directory: /test/postgres
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: test

  # The sample, examples/docker-compose.yaml, pinned the same way: each
  # release of dromas-server comes as a pull request. A new major version of
  # PostgreSQL does not, since a data directory moves to one only by an
  # upgrade of its own.
  - package-ecosystem: docker-compose
    directory: /examples
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: examples

  # The Dockerfile's base image, a tag pinned by its index digest: a new
  # digest of the tag comes as a pull request.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      images:
        patterns: ["*"]
    commit-message:
      prefix: docker
