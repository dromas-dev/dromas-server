# The PostgreSQL CI's test job runs every test on (.github/workflows/ci.yml),
# and the one a laptop may run the same way: docker compose -f
# test/postgres/compose.yaml up -d. Logical replication on, a replication slot
# and a WAL sender for each store the tests run at once. The image is a tag
# pinned by its index digest, which Dependabot moves (.github/dependabot.yml,
# docker-compose), and its major version is the oldest this backend runs on
# (minServerVersion).
name: dromas-test
services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    container_name: postgres
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=200, -c, max_wal_senders=200, -c, max_connections=1000]
    environment:
      POSTGRES_PASSWORD: dromas
      POSTGRES_DB: dromas_test
    ports:
      - 127.0.0.1:5432:5432
