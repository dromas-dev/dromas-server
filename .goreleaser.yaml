# dromasd's releases, which .github/workflows/release.yml makes from a signed
# tag: a static binary for each Linux architecture CI runs the server on,
# archived with the licence and README, an SBOM of each archive, and
# checksums.txt, signed with cosign, whose files the workflow attests. Built
# from the tagged module as Go's module proxy serves it (gomod.proxy), so a
# release is what go install …@<tag> builds, and with GoReleaser's settings
# for a reproducible build. The release's image is docker-publish.yml's.
# goreleaser release --snapshot --clean builds it all into dist/ and
# publishes nothing.
version: 2

project_name: dromasd

gomod:
  proxy: true

builds:
  - id: dromasd
    main: ./cmd/dromasd
    binary: dromasd
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    builds_info: &info
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: *info
      - src: README.md
        info: *info

checksum:
  name_template: checksums.txt

# checksums.txt signed with cosign, keyless, as GoReleaser documents it
# (customization/sign): checksums.txt.sigstore.json, made by the release
# workflow's own identity.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

# An SPDX document of each archive, by syft, with GoReleaser's own arguments,
# named as OpenSSF Scorecard looks for one. checksums.txt names each, so its
# signature and the attestations cover them.
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.json"

# Each commit since the last tag, with its link, as GoReleaser lists its own.
changelog:
  use: github
  sort: asc

# The notes open with the signed tag's message past its first line (empty
# for a plain patch) and close with the image and how to check what was
# downloaded.
release:
  header: "{{ .TagBody }}"
  footer: |
    ## Image

    `ghcr.io/dromas-dev/dromasd:{{ .Version }}`, for `linux/amd64` and `linux/arm64`, built from the same tag by this repository's `docker-publish.yml` once this release is published, with an attestation of the build and an attested SPDX SBOM (the second command):

    ```sh
    gh attestation verify oci://ghcr.io/dromas-dev/dromasd:{{ .Version }} -R dromas-dev/dromas-server --signer-workflow dromas-dev/dromas-server/.github/workflows/docker-publish.yml --source-ref refs/tags/{{ .Tag }}
    gh attestation verify oci://ghcr.io/dromas-dev/dromasd:{{ .Version }} -R dromas-dev/dromas-server --signer-workflow dromas-dev/dromas-server/.github/workflows/docker-publish.yml --source-ref refs/tags/{{ .Tag }} --predicate-type https://spdx.dev/Document/v2.3
    ```

    ## Verify

    Built from the signed tag {{ .Tag }} by this repository's release workflow. With gh 2.102.0 or later:

    ```sh
    gh release verify-asset {{ .Tag }} <file> -R dromas-dev/dromas-server
    gh attestation verify <file> -R dromas-dev/dromas-server --signer-workflow dromas-dev/dromas-server/.github/workflows/release.yml --source-ref refs/tags/{{ .Tag }}
    ```

    Or with cosign, checking `checksums.txt` against the workflow that signed it, then each file against `checksums.txt`:

    ```sh
    cosign verify-blob --certificate-identity https://github.com/dromas-dev/dromas-server/.github/workflows/release.yml@refs/tags/{{ .Tag }} --certificate-oidc-issuer https://token.actions.githubusercontent.com --bundle checksums.txt.sigstore.json checksums.txt
    sha256sum --ignore-missing -c checksums.txt
    ```
